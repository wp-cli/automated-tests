name: Testing

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    - cron:  '0 0 * * *' # Run every day at midnight.

# Each run fans out to 155 jobs, so overlapping runs are expensive.
# Keying on the ref lets a new push supersede the run it replaces, for pull
# requests and branches alike. Keying on the event as well keeps a push to the
# default branch and the nightly schedule from cancelling each other, since both
# report the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  functional:
    name: ${{ matrix.test-package }}
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.5']
        wp: ['latest', 'trunk']
        use-phar: [false, true]
        test-package:
          - wp-cli-bundle
          - wp-cli
          - ability-command
          - ai-command
          - block-command
          - cache-command
          - checksum-command
          - config-command
          - core-command
          - cron-command
          - db-command
          - embed-command
          - entity-command
          - eval-command
          - export-command
          - extension-command
          - i18n-command
          - import-command
          - language-command
          - maintenance-mode-command
          - media-command
          - package-command
          - rewrite-command
          - role-command
          - scaffold-command
          - search-replace-command
          - server-command
          - shell-command
          - site-health-command
          - super-admin-command
          - widget-command
        exclude:
          # PHP 7.4 is covered per-package across the full version matrix. Keep a
          # single bundle-integration leg for it — enough to catch a package
          # raising its PHP requirement and breaking `composer install` for the
          # bundle, which is the one failure only this repository sees.
          - php: '7.4'
            wp: trunk
          - php: '7.4'
            use-phar: false

    uses: ./.github/workflows/reusable-testing.yml
    with:
      test-package: ${{ matrix.test-package }}
      php: ${{ matrix.php }}
      wp: ${{ matrix.wp }}
      use-phar: ${{ matrix.use-phar }}

